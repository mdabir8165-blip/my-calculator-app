<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Digital Calculator </title>
    <link rel="stylesheet" href="style.css" type="text/css" />
    

</head>
<body>
    
    <div class="Calculator">
        <h3> Digital Calculator </h3>

        <input type="text" class="display" readonly maxlength="12"><br>
        <hr class="divider">
        <input type="button" id="reset" value="RT">
        <input type="button" id="delete" value="DEL">
        <input type="button" id="percent" value="%">
        <input type="button" id="doubleZero" value="00"><br>
        <input type="button" id="seven" value="7">
        <input type="button" id="eight" value="8">
        <input type="button" id="nine" value="9">
        <input type="button" id="divison" value="÷"><br>
        <input type="button" id="four" value="4">
        <input type="button" id="five" value="5">
        <input type="button" id="six" value="6">
        <input type="button" id="multiplication" value="×"><br>
        <input type="button" id="one" value="1">
        <input type="button" id="two" value="2">
        <input type="button" id="three" value="3">
        <input type="button" id="subtraction" value="-"><br>
        <input type="button" id="dot" value=".">
        <input type="button" id="zero" value="0">
        <input type="button" id="eqal" value="=">
        <input type="button" id="addition" value="+">


    </div>
    <script src="index.js"></script>
</body>
</html>
